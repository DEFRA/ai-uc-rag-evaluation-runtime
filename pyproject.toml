[project]
name = "ai-uc-rag-evaluation-runtime"
version = "0.1.0"
description = "ai-uc-rag-evaluation-runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asgi-logger==0.1.0",
    "aws-embedded-metrics==3.3.1",
    "dnspython==2.8.0",
    "ecs-logging==2.3.0",
    "fastapi==0.135.1",
    "httpx==0.28.1",
    "pydantic-settings==2.13.1",
    "pymongo[aws,encryption,snappy,zstd]==4.16.0",
    "uvicorn==0.41.0",
    "pydantic-evals==1.67.0",
    "pydantic-ai-slim[bedrock]==1.67.0",
    "aiohttp==3.13.3",
    "cryptography==46.0.5",
    "urllib3==2.6.3",
    "starlette==0.49.1",
    "boto3-stubs[sqs]~=1.42.63",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==1.19.1",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "pytest-mock==3.15.1",
    "ruff==0.15.5",
    "taskipy==1.14.1",
]

[project.scripts]
ai-uc-rag-evaluation-runtime = "app.entrypoints.fastapi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.coverage.run]
branch = true
include = ["app/*"]
omit = ["tests/*"]

[tool.coverage.html]
directory = "coverage/coverage_html"

[tool.coverage.xml]
output = "coverage/coverage.xml"

[tool.taskipy.tasks]
format = "uv run ruff format . && uv run ruff check . --fix"
lint = "uv run ruff format ./app ./tests --check && uv run ruff check ./app ./tests"
typecheck = "uv run mypy ./app ./tests"
test = "uv run task lint && uv run task typecheck && uv run coverage run -m pytest -vv && uv run coverage html && uv run coverage xml"

[tool.pytest]
minversion = "7.0"
testpaths = [
    "tests",
]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "pymongo.*"
ignore_missing_imports = true

